name: Java Spring Boot CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo mã nguồn về runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường JDK & Tự động bật Cache thư viện Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Bước 3: Xác nhận Maven có sẵn trên runner
      - name: Check Maven
        run: mvn --version

      # GIAI ĐOẠN 1: Kiểm tra cú pháp & Chuẩn code (Checkstyle / Lint)
      - name: Step 1 - Check Code Style & Syntax
        run: mvn clean

      # GIAI ĐOẠN 2: Biên dịch mã nguồn (Build / Compile)
      - name: Step 2 - Compile Source Code
        run: mvn compile -DskipTests

      # GIAI ĐOẠN 3: Chạy toàn bộ Unit / Integration Tests
      - name: Step 3 - Run Automated Tests
        run: mvn test

      # Lưu lại báo cáo kết quả kiểm thử (dù test pass hay fail)
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      # GIAI ĐOẠN 4: Đóng gói ứng dụng (Package .jar)
      - name: Step 4 - Package Application (Create JAR)
        run: mvn package -DskipTests

      # Lưu trữ file JAR thành phẩm lên GitHub Artifacts
      - name: Upload Packaged Artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app-jar
          path: target/*.jar
          retention-days: 7
